<!Doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width initial-scale=1.0">
    </head>
    <body>
        <!-- <fieldset>을 활용할지 div사용할지 고민 -->
         <!-- 'CSS에서 .box를 사용해서 class="box"를 가진 요소에 스타일을 적용하기 위해 div사용' -->
        <div class="box">
        <h2>
           <p><em>To.OO</em></p> 
           <!-- 받는 사람 이름 기입, 및 em이 인라인 요소인것 생각해서 p태그 안에 사용 -->
        </h2>
        <h3>
            <p>
             <em>oo아 정신차리자 제정신이냐<br>
                좀 일찍일찍 일어나고 새벽 4-5시에 자러 들어가지말고<br>
                독서실로 와라 기다리고 있을테니
             </em>
            </p>
        </h3>
        </div>
        
    </body>
</html>
