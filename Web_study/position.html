<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <style>
            div{
                width: 100px; height: 100px;
                background-color: red;
                position: relative;
                top: 10px; left: 10px;
                border: 1px solid #000000;
            }

            .abs{
                width: 50px; height: 50px;
                background-color: yellow;
                position: absolute;
                top: 10px; right: 10px;
            }
            
            .fix{
                width:50px; height: 50px;
                background-color: antiquewhite;
                position: sticky;
                top: 0px;
            }
        </style>

    </head>
    <body>
        <div></div>
        <div>
            <div class="abs"></div>
        </div>
        <div class="fix"></div>
        hello<br>hello<br>hello<br>hello<br>

        hello<br>hello<br>hello<br>hello<br>
        hello<br>hello<br>hello<br>hello<br>
        hello<br>hello<br>hello<br>hello<br>
        

    </body>
</html>
